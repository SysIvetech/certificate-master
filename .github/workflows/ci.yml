name: CI

# PR과 develop/main 브랜치에 push 될 때 백엔드(FastAPI)/프론트엔드(Next.js) 빌드 + 테스트
# 배포는 별도 워크플로우(deploy.yml)에서 처리

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (FastAPI) - Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Run tests
        # NOTE: 일부 테스트가 MariaDB/Supabase/ChromaDB 등 외부 인프라를 필요로 할 수 있어
        # GitHub Actions 러너에서 100% 통과가 보장되지 않습니다. 안정화 후 continue-on-error 제거 권장.
        run: uv run pytest
        continue-on-error: true

  frontend-build:
    name: Frontend (Next.js) - Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # 버전은 frontend/package.json 의 packageManager 필드(pnpm@10.x)를 따름
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (CI 검증용 더미 환경 변수)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:5100
